<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公告详情</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrap">

    <p class="back"><a id="back-link" href="index.html">← 返回列表</a></p>

    <h1 id="title"></h1>
    <p class="meta" id="meta"></p>
    <div class="article-body" id="content"></div>

  </div>

  <script>
    var params = new URLSearchParams(location.search);
    var id     = params.get('id');
    var from   = params.get('from');

    if (from) {
      document.getElementById('back-link').href = 'index.html?page=' + from;
    }

    function showError(titleText, metaText) {
      document.getElementById('title').textContent   = titleText;
      document.getElementById('meta').textContent    = metaText;
      document.getElementById('content').textContent = '';
    }

    async function load() {
      if (!id) {
        showError('缺少文章编号', '请从列表页点击公告标题进入。');
        return;
      }

      try {
        var res = await fetch('http://localhost:8000/api/articles/' + id);

        if (!res.ok && res.status !== 404) {
          throw new Error('HTTP ' + res.status);
        }

        var json = await res.json();

        if (json.code !== 0) {
          showError('文章不存在', '该公告可能已被删除，或链接有误。');
          return;
        }

        document.getElementById('title').textContent   = json.data.title;
        document.getElementById('meta').textContent    = '发布于 ' + json.data.created_at;
        document.getElementById('content').textContent = json.data.content;
        document.title = json.data.title;

      } catch (e) {
        showError('加载失败', '无法连接后端，请确认后端服务已启动，然后刷新页面。');
      }
    }

    load();
  </script>

</body>
</html>
