<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理端</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrap">

    <p class="back"><a href="index.html">← 返回列表</a></p>

    <h1>管理端</h1>

    <h2 id="form-title">发布公告</h2>

    <div class="field">
      <label for="title">标题</label>
      <input type="text" id="title" maxlength="100" placeholder="不超过 100 字">
    </div>

    <div class="field">
      <label for="content">正文</label>
      <textarea id="content" rows="9" placeholder="公告正文内容"></textarea>
    </div>

    <div class="field">
      <label for="status">状态</label>
      <select id="status">
        <option value="1">发布（前台可见）</option>
        <option value="0">存草稿（前台不可见）</option>
      </select>
    </div>

    <div class="actions">
      <button id="submit">提交</button>
      <button id="cancel" class="ghost" style="display:none">取消编辑</button>
    </div>

    <p class="msg" id="msg"></p>

    <h2>文章管理</h2>
    <ul class="list admin" id="admin-list"></ul>

    <div class="pager">
      <button id="prev">上一页</button>
      <span id="info"></span>
      <button id="next">下一页</button>
    </div>

  </div>

  <script>
    var editingId = null;
    var adminPage = 1;
    var ADMIN_SIZE = 5;

    function resetForm() {
      editingId = null;
      document.getElementById('form-title').textContent = '发布公告';
      document.getElementById('title').value   = '';
      document.getElementById('content').value = '';
      document.getElementById('status').value  = '1';
      document.getElementById('cancel').style.display = 'none';
    }

    async function startEdit(id) {
      var res  = await fetch('http://localhost:8000/api/admin/articles/' + id);
      var json = await res.json();

      if (json.code !== 0) {
        alert('加载失败：' + json.message);
        return;
      }

      editingId = json.data.id;
      document.getElementById('form-title').textContent = '编辑公告 #' + json.data.id;
      document.getElementById('title').value   = json.data.title;
      document.getElementById('content').value = json.data.content;
      document.getElementById('status').value  = json.data.status;
      document.getElementById('cancel').style.display = 'inline-block';
      window.scrollTo(0, 0);
    }

    async function loadAdminList() {
      var res  = await fetch('http://localhost:8000/api/admin/articles?page=' + adminPage + '&size=' + ADMIN_SIZE);
      var json = await res.json();

      var total      = json.data.total;
      var totalPages = Math.max(1, Math.ceil(total / ADMIN_SIZE));

      if (adminPage > totalPages) {
        adminPage = totalPages;
        return loadAdminList();
      }

      var ul = document.getElementById('admin-list');
      ul.innerHTML = '';

      document.getElementById('info').textContent = '第 ' + adminPage + ' / ' + totalPages + ' 页 · 共 ' + total + ' 篇';
      document.getElementById('prev').disabled = adminPage <= 1;
      document.getElementById('next').disabled = adminPage >= totalPages;

      if (json.data.list.length === 0) {
        var empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = '还没有任何公告';
        ul.appendChild(empty);
        return;
      }

      json.data.list.forEach(function (item) {
        var li = document.createElement('li');

        var main = document.createElement('span');
        main.className = 'item-main';

        var span = document.createElement('span');
        span.className = 'item-title';
        span.textContent = item.title;
        main.appendChild(span);

        if (item.status === 0) {
          var tag = document.createElement('span');
          tag.className = 'tag-draft';
          tag.textContent = '草稿';
          main.appendChild(tag);
        }

        var btn = document.createElement('button');
        btn.textContent = '编辑';
        btn.onclick = function () { startEdit(item.id); };

        var del = document.createElement('button');
        del.className = 'danger';
        del.textContent = '删除';
        del.onclick = function () { remove(item.id); };

        li.appendChild(main);
        li.appendChild(btn);
        li.appendChild(del);
        ul.appendChild(li);
      });
    }

    async function remove(id) {
      if (!confirm('确定删除这篇公告吗？删除后前台将不再显示。')) {
        return;
      }

      var res  = await fetch('http://localhost:8000/api/admin/articles/' + id, {
        method: 'DELETE'
      });
      var json = await res.json();

      var msg = document.getElementById('msg');

      if (json.code === 0) {
        msg.textContent = '已删除 #' + id;

        if (editingId === id) {
          resetForm();
        }
        loadAdminList();
      } else {
        msg.textContent = '失败：' + json.message;
      }
    }

    document.getElementById('submit').onclick = async function () {
      var msg = document.getElementById('msg');

      var body = {
        title:   document.getElementById('title').value,
        content: document.getElementById('content').value,
        status:  Number(document.getElementById('status').value)
      };

      if (body.title.trim() === '') {
        msg.textContent = '标题不能为空';
        return;
      }
      if (body.content.trim() === '') {
        msg.textContent = '正文不能为空';
        return;
      }

      var url    = 'http://localhost:8000/api/admin/articles';
      var method = 'POST';

      if (editingId !== null) {
        url    = url + '/' + editingId;
        method = 'PUT';
      }

      var res = await fetch(url, {
        method:  method,
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(body)
      });

      var json = await res.json();

      if (json.code === 0) {
        msg.textContent = (method === 'POST' ? '发布成功' : '修改成功') + '，id = ' + json.data.id;

        if (method === 'POST') {
          adminPage = 1;
        }

        resetForm();
        loadAdminList();
      } else {
        msg.textContent = '失败：' + json.message;
      }
    };

    document.getElementById('cancel').onclick = function () {
      resetForm();
      document.getElementById('msg').textContent = '';
    };

    document.getElementById('prev').onclick = function () {
      if (adminPage > 1) {
        adminPage--;
        loadAdminList();
      }
    };

    document.getElementById('next').onclick = function () {
      adminPage++;
      loadAdminList();
    };

    resetForm();
    loadAdminList();
  </script>

</body>
</html>
