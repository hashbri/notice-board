<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公告资讯</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="wrap">

    <header class="page-head">
      <h1>公告资讯</h1>
      <a class="jump" href="admin.html">管理端</a>
    </header>
    <p class="sub" id="summary"></p>

    <ul class="list" id="list"></ul>

    <div class="pager">
      <button id="prev">上一页</button>
      <span id="info"></span>
      <button id="next">下一页</button>
    </div>

  </div>

  <script>
    var PAGE_SIZE = 5;

    var page = parseInt(new URLSearchParams(location.search).get('page'), 10);
    if (!page || page < 1) {
      page = 1;
    }

    function showMessage(text) {
      var ul = document.getElementById('list');
      ul.innerHTML = '';

      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = text;
      ul.appendChild(li);
    }

    function lockPager() {
      document.getElementById('info').textContent    = '';
      document.getElementById('prev').disabled = true;
      document.getElementById('next').disabled = true;
    }

    async function load() {
      var ul = document.getElementById('list');

      try {
        var res = await fetch('http://localhost:8000/api/articles?page=' + page + '&size=' + PAGE_SIZE);

        if (!res.ok) {
          throw new Error('HTTP ' + res.status);
        }

        var json = await res.json();

        if (json.code !== 0) {
          throw new Error(json.message);
        }

        var list  = json.data.list;
        var total = json.data.total;
        var size  = json.data.size;
        var pages = Math.max(1, Math.ceil(total / size));

        ul.innerHTML = '';
        document.getElementById('summary').textContent = '共 ' + total + ' 条';

        if (list.length === 0) {
          showMessage('暂无公告');
          lockPager();
          return;
        }

        list.forEach(function (item) {
          var li = document.createElement('li');
          var a  = document.createElement('a');
          a.href = 'detail.html?id=' + item.id + '&from=' + page;

          var t = document.createElement('span');
          t.className = 'item-title';
          t.textContent = item.title;

          var d = document.createElement('span');
          d.className = 'item-date';
          d.textContent = item.created_at.slice(0, 10);

          a.appendChild(t);
          a.appendChild(d);
          li.appendChild(a);
          ul.appendChild(li);
        });

        document.getElementById('info').textContent = '第 ' + page + ' / ' + pages + ' 页';
        document.getElementById('prev').disabled = (page <= 1);
        document.getElementById('next').disabled = (page >= pages);

      } catch (e) {
        document.getElementById('summary').textContent = '';
        showMessage('加载失败，无法连接后端。请确认后端服务已启动，然后刷新页面。');
        lockPager();
      }
    }

    function go(target) {
      page = target;
      history.replaceState(null, '', 'index.html?page=' + page);
      load();
      window.scrollTo(0, 0);
    }

    document.getElementById('prev').onclick = function () {
      if (page > 1) {
        go(page - 1);
      }
    };

    document.getElementById('next').onclick = function () {
      go(page + 1);
    };

    load();
  </script>

</body>
</html>
